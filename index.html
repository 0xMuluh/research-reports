<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Research Reports — Data Science Group</title>
  <meta name="description" content="Hosted research reports from the Data Science group. Explore public and protected research, publications, and study outcomes in data science, metabolomics, and microbiome research." />
  <link rel="stylesheet" href="reports.css?v=13" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="/reports" aria-label="Research Reports Hub">
        <img class="brand-logo" src="assets/utu-logo.png" alt="University of Turku Logo" />
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-text">Research Reports</span>
      </a>

      <div class="header-search">
        <label for="q" class="visually-hidden">Search reports</label>
        <span class="search-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input id="q" type="search" placeholder="Search reports..." aria-label="Search reports" />
      </div>

      <nav aria-label="Primary" class="top-nav">
        <a href="https://datascience.utu.fi/">Home</a>
        <a href="https://datascience.utu.fi/research">Research</a>
        <a href="https://datascience.utu.fi/edu">Edu</a>
        <a href="https://datascience.utu.fi/code">Code</a>
        <a href="https://datascience.utu.fi/team">Team</a>
        <a href="https://datascience.utu.fi/contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container" id="app" role="main">
    <h1 class="visually-hidden">Research Reports — Data Science Group, University of Turku</h1>
    
    <section class="filter-section" aria-label="Filters">
      <div class="filter-summary-row">
        <div id="counts" class="counts" aria-live="polite"></div>
        <button id="filter-toggle-btn" class="toggle-filters-btn" aria-expanded="false" aria-controls="filter-panel">
          <svg class="icon-filter" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
          Filters
        </button>
      </div>

      <div id="filter-panel" class="filter-panel collapsed">
        <div class="filter-panel-inner">
          <div class="filter-group">
            <span class="filter-label">Access:</span>
            <div class="filters" role="group" aria-label="Report filters">
              <button class="filter-btn active" data-filter="all">All</button>
              <button class="filter-btn" data-filter="protected">Protected</button>
              <button class="filter-btn" data-filter="public">Public</button>
            </div>
          </div>

          <div class="filter-group">
            <span class="filter-label">Year:</span>
            <select id="year-filter" aria-label="Filter by year" class="select-filter">
              <option value="all">All Years</option>
            </select>
          </div>

          <div id="counts-detail" class="counts-detail" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section id="reports" class="reports" aria-live="polite"></section>
    <div id="pagination" class="pagination" aria-label="Pagination Navigation"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Data Science Group · University of Turku</p>
    </div>
  </footer>

  <script src="reports.js?v=13" defer></script>
</body>
</html>
