<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="teal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5a4" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#teal-bg)" />

  <!-- R Glyph -->
  <text x="168" y="372" font-family="system-ui, -apple-system, 'SF Pro Display', Inter, sans-serif" font-weight="800" font-size="320" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">R</text>

  <!-- Superscript 2 -->
  <text x="365" y="215" font-family="system-ui, -apple-system, 'SF Pro Display', Inter, sans-serif" font-weight="900" font-size="185" fill="#fef08a" text-anchor="middle" filter="url(#shadow)">2</text>
</svg>